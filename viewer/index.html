<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TME 4D Viewer</title>
<style>
  :root {
    --bg: #0e1116; --panel: rgba(22, 27, 34, 0.88); --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; backdrop-filter: blur(4px); }
  #controls { top: 12px; left: 12px; width: 260px; }
  #section { top: 12px; right: 12px; width: 300px; }
  #organs { right: 12px; top: 420px; width: 300px; overflow-y: auto; }
  #organs table { width: 100%; border-collapse: collapse; font-size: 11px; }
  #organs td { padding: 1px 0; }
  #organs td.n { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
  #organs td.s { color: var(--muted); padding-left: 8px; }
  #organs tr.hdr td { color: var(--accent); font-weight: 600; padding-top: 6px; }
  #organMeta { font-size: 11px; margin-bottom: 4px; }
  h1 { font-size: 13px; margin: 0 0 8px; font-weight: 600; }
  label { display: block; color: var(--muted); margin-top: 8px; }
  label span { color: var(--text); float: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select, button { background: #21262d; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; font: inherit; cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }
  button.rec { border-color: #f85149; }
  .row { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
  .seg { display: flex; margin-top: 6px; }
  .seg button { flex: 1; border-radius: 0; }
  .seg button:first-child { border-radius: 6px 0 0 6px; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button.on { background: var(--accent); color: #0e1116; border-color: var(--accent); }
  #xs { display: block; width: 100%; aspect-ratio: 1; margin-top: 8px; border-radius: 4px; background: #000; }
  .legend { display: flex; gap: 10px; margin-top: 8px; color: var(--muted); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  #status { margin-top: 8px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  label.check { display: flex; gap: 6px; align-items: center; color: var(--text); }
  label.check input { accent-color: var(--accent); margin: 0; }
  #lineage div { margin-top: 4px; }
  .path { font-size: 11px; max-height: 72px; overflow-y: auto; word-break: break-word; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); }
  @media (max-width: 700px) {
    #controls { width: auto; right: 12px; top: auto; bottom: 12px; }
    #section { width: 180px; }
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="loading">Loading frames…</div>

<div id="controls" class="panel">
  <h1>TME 4D Viewer</h1>
  <div class="row">
    <button id="play">▶ Play</button>
    <button id="record" class="rec">● Record video</button>
  </div>
  <label>Time <span id="tval">0 h</span></label>
  <input id="time" type="range" min="0" max="1" step="0.01" value="0">
  <label>Speed <span id="sval">12 h/s</span></label>
  <input id="speed" type="range" min="0" max="100" step="1" value="80">
  <label>Cell opacity <span id="oval">1.00</span></label>
  <input id="opacity" type="range" min="0.02" max="1" step="0.01" value="1">
  <label>Rendering</label>
  <select id="style">
    <option value="spheres">Cells (spheres)</option>
    <option value="smooth">Smooth tissue (blob)</option>
  </select>
  <div id="smoothRow" hidden>
    <label>Smoothing <span id="smval">10 µm</span></label>
    <input id="smoothing" type="range" min="2" max="30" step="0.5" value="10">
  </div>
  <label class="check"><input id="wobble" type="checkbox" checked> Membrane wobble</label>
  <label class="check"><input id="showStroma" type="checkbox" checked> Fibroblasts + immune cells</label>
  <label class="check"><input id="showPlane" type="checkbox" checked> Cross-section plane</label>
  <label>Color by</label>
  <select id="color">
    <option value="phase">Cell-cycle phase (Fucci-style)</option>
    <option value="o2">Oxygen (pO2)</option>
    <option value="lineage">Lineage (founding clone)</option>
  </select>
  <div class="legend" id="legend"></div>
  <div id="status"></div>
  <h1 style="margin-top:12px">Lineage</h1>
  <div id="lineage"></div>
</div>

<div id="organs" class="panel" hidden>
  <h1>Lymphoid organs <span id="organAge" class="muted"></span></h1>
  <div id="organMeta" class="muted"></div>
  <table id="organTable"></table>
</div>

<div id="section" class="panel">
  <h1>Cross-section</h1>
  <div class="seg" id="plane">
    <button data-axis="2" class="on">Transverse</button>
    <button data-axis="1">Coronal</button>
    <button data-axis="0">Sagittal</button>
  </div>
  <label>Position <span id="pval">0 µm</span></label>
  <input id="slice" type="range" min="-400" max="400" step="1" value="0">
  <canvas id="xs" width="600" height="600"></canvas>
</div>

<script type="module" src="viewer.js"></script>
</body>
</html>
